{% extends 'base.html' %}
{% load static %}

{% block title %}
    Login
{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'accounts/css/login.css' %}">
{% endblock %}

{% block content %}

<div class="auth-container login-page">

    <div class="auth-card">

        <div class="auth-icon-badge" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none"><rect x="5" y="10.5" width="14" height="9" rx="1.8" stroke="currentColor" stroke-width="1.6"/><path d="M8 10.5V7.5C8 5.3 9.8 3.5 12 3.5C14.2 3.5 16 5.3 16 7.5V10.5" stroke="currentColor" stroke-width="1.6"/></svg>
        </div>

        <h1>Login</h1>
        <p class="auth-subtitle">Welcome back — enter your details to continue.</p>


        <form method="POST" class="auth-form">

            {% csrf_token %}

            <div class="form-group auth-field">

                <label for="id_username">Username</label>

                <input type="text"
                       name="username"
                       id="id_username"
                       class="auth-input"
                       placeholder="Enter your username"
                       required>

            </div>


            <div class="form-group auth-field">

                <label for="id_password">Password</label>

                <input type="password"
                       name="password"
                       id="id_password"
                       class="auth-input"
                       placeholder="Enter your password"
                       required>

            </div>


            <button type="submit" class="auth-submit-btn">
                Login
            </button>

        </form>


        <p class="auth-switch">
            Don't have an account?

            <a href="{% url 'register' %}">
                Register
            </a>
        </p>

    </div>

</div>

{% endblock %}
