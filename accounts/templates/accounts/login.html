{% extends 'base.html' %}

{% block title %}
    Login
{% endblock %}


{% block content %}

<div class="auth-container">

    <h1>Login</h1>

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">

            <label>Username</label>

            <input type="text"
                   name="username"
                   required>

        </div>


        <div class="form-group">

            <label>Password</label>

            <input type="password"
                   name="password"
                   required>

        </div>


        <button type="submit">
            Login
        </button>

    </form>


    <p>
        Don't have an account?

        <a href="{% url 'register' %}">
            Register
        </a>
    </p>

</div>

{% endblock %}
