{% extends 'base.html' %}

{% block title %}
    Add Lesson
{% endblock %}


{% block content %}

<div class="auth-container">

    <h1>➕ Add Lesson</h1>

    <p>
        Course:
        <strong>{{ course.title }}</strong>
    </p>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Create Lesson
        </button>

    </form>

    <br>

    <a href="{% url 'course_detail' course.id %}">
        ← Back to Course
    </a>

</div>

{% endblock %}
