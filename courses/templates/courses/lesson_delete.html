{% extends 'base.html' %}

{% block title %}
    Delete Lesson
{% endblock %}


{% block content %}

<div class="auth-container">

    <h1>🗑️ Delete Lesson</h1>

    <p>
        Are you sure you want to delete:
    </p>

    <h2>
        "{{ lesson.title }}"
    </h2>

    <form method="POST">

        {% csrf_token %}

        <button type="submit"
                class="delete-btn">
            Yes, Delete
        </button>

    </form>

    <br>

    <a href="{% url 'course_detail' lesson.course.id %}">
        Cancel
    </a>

</div>

{% endblock %}
